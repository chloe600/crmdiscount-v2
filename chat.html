<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRMdiscount AI Assistant</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12172B; --ink-soft:#4A5169; --accent:#4F46E5; --accent-deep:#4338CA;
  --paper:#FFFFFF; --wash:#F6F7FB; --line:#E4E7F0;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--paper);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.head{background:var(--ink);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;flex:none}
.head .dot{width:34px;height:34px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.head strong{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:.98rem;font-weight:800;line-height:1.2}
.head small{display:block;font-size:.7rem;color:rgba(255,255,255,.65);letter-spacing:.04em}
.msgs{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:10px;background:var(--wash)}
.b{max-width:86%;padding:10px 14px;border-radius:14px;font-size:.9rem;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
.b.bot{align-self:flex-start;background:var(--paper);border:1px solid var(--line);color:var(--ink);border-bottom-left-radius:4px}
.b.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.typing{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:14px;border-bottom-left-radius:4px;padding:12px 14px;display:none;gap:4px}
.typing.on{display:flex}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-soft);opacity:.4;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:.9}}
.inrow{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--paper);flex:none}
.in{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;font-family:inherit;font-size:.92rem;color:var(--ink);outline:none;resize:none;max-height:96px}
.in:focus{border-color:var(--accent)}
.send{background:var(--accent);border:none;border-radius:12px;color:#fff;width:46px;flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.send:disabled{opacity:.5;cursor:default}
.send:hover:not(:disabled){background:var(--accent-deep)}
.foot{flex:none;text-align:center;font-size:.66rem;color:var(--ink-soft);padding:8px 12px;background:var(--paper)}
@media (prefers-reduced-motion:reduce){.typing i{animation:none;opacity:.6}}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="head">
  <span class="dot">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  </span>
  <span><strong>CRMdiscount assistant</strong><small>AI &middot; instant answers &middot; human follow-up on email</small></span>
</div>
<div class="msgs" id="msgs">
  <div class="typing" id="typing"><i></i><i></i><i></i></div>
</div>
<div class="inrow">
  <textarea class="in" id="inBox" rows="1" maxlength="1000" placeholder="Type here&hellip;" aria-label="Your message"></textarea>
  <button class="send" id="sendBtn" aria-label="Send">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13 M22 2 15 22 11 13 2 9z"/></svg>
  </button>
</div>
<p class="foot">AI assistant. Estimates are illustrative &mdash; only HubSpot can quote your subscription.</p>

<script>
(function(){
  var ENDPOINT = "/api/chat";
  var SESSION_ID = Math.random().toString(36).slice(2) + Date.now().toString(36);
  var G1 = "Hi \u2014 I\u2019m the CRMdiscount AI assistant.";
  var G2 = "Tell me four things and I\u2019ll give you an itemized year-one estimate:\n\n1. Which hubs you\u2019re considering\n2. Roughly how many contacts\n3. How many people will genuinely log in weekly\n4. When you need to decide\n\nOr just ask me anything about HubSpot pricing.";

  var msgsEl = document.getElementById("msgs");
  var typing = document.getElementById("typing");
  var input = document.getElementById("inBox");
  var sendBtn = document.getElementById("sendBtn");
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var messages = [];
  var pending = false;
  var engagedFired = false;
  var greetTimers = [];
  var greetingDone = false;
  var activeTypewriter = null;

  function notifyParent(evt){
    try { if (window.parent && window.parent !== window) window.parent.postMessage({ crmchat_event: evt }, "*"); } catch(e){}
  }
  function scrollDown(){ msgsEl.scrollTop = msgsEl.scrollHeight; }
  function showTyping(on){ typing.classList.toggle("on", on); if(on) scrollDown(); }

  function makeBubble(role){
    var d = document.createElement("div");
    d.className = "b " + (role === "assistant" ? "bot" : "me");
    msgsEl.insertBefore(d, typing);
    return d;
  }

  // Types text into a bubble character-chunk by chunk; returns a cancel/finish function
  function typeInto(el, text, done){
    if (reduced) { el.textContent = text; scrollDown(); if (done) done(); return function(){}; }
    var i = 0;
    var chunk = text.length > 400 ? 6 : 3;   // long replies type faster
    var iv = setInterval(function(){
      i = Math.min(i + chunk, text.length);
      el.textContent = text.slice(0, i);
      scrollDown();
      if (i >= text.length) { clearInterval(iv); activeTypewriter = null; if (done) done(); }
    }, 24);
    var finish = function(){
      clearInterval(iv);
      el.textContent = text;
      scrollDown();
      activeTypewriter = null;
      if (done) done();
    };
    activeTypewriter = finish;
    return finish;
  }

  function addBubble(role, text, animate){
    var el = makeBubble(role);
    if (animate) { typeInto(el, text); } else { el.textContent = text; }
    scrollDown();
  }

  // ---- Arrival choreography: agent "types" the greeting in two beats ----
  function runGreeting(){
    showTyping(true);
    greetTimers.push(setTimeout(function(){
      showTyping(false);
      var b1 = makeBubble("assistant");
      typeInto(b1, G1, function(){
        showTyping(true);
        greetTimers.push(setTimeout(function(){
          showTyping(false);
          var b2 = makeBubble("assistant");
          typeInto(b2, G2, function(){ greetingDone = true; });
        }, reduced ? 0 : 850));
      });
    }, reduced ? 0 : 1100));
    messages.push({ role: "assistant", content: G1 + "\n\n" + G2 });
  }

  // If the visitor starts before the show finishes, cut to the end instantly
  function finishGreetingNow(){
    if (greetingDone) return;
    greetingDone = true;
    if (!greetStarted) {
      greetStarted = true;
      messages.push({ role: "assistant", content: G1 + "\n\n" + G2 });
      addBubble("assistant", G1, false);
      addBubble("assistant", G2, false);
      return;
    }
    greetTimers.forEach(clearTimeout);
    if (activeTypewriter) activeTypewriter();
    showTyping(false);
    var bots = msgsEl.querySelectorAll(".b.bot");
    if (bots.length === 0) { addBubble("assistant", G1, false); addBubble("assistant", G2, false); }
    else if (bots.length === 1) { bots[0].textContent = G1; addBubble("assistant", G2, false); }
  }

  function send(){
    if (pending) return;
    var text = input.value.trim();
    if (!text) return;
    finishGreetingNow();
    input.value = "";
    messages.push({ role: "user", content: text });
    addBubble("user", text, false);
    if (!engagedFired) { engagedFired = true; notifyParent("chat_engaged"); }
    pending = true;
    sendBtn.disabled = true;
    var t0 = Date.now();
    showTyping(true);

    fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: messages.slice(-24), session: SESSION_ID })
    })
    .then(function(r){ if (!r.ok) throw new Error("http " + r.status); return r.json(); })
    .then(function(data){
      var reply = (data && data.reply) ? String(data.reply) : "";
      if (!reply) throw new Error("empty");
      messages.push({ role: "assistant", content: reply });
      return reply;
    })
    .catch(function(){
      return "Sorry \u2014 I\u2019m having trouble connecting right now. Email team@crmdiscount.ai with your four details and you\u2019ll get the estimate the same working day.";
    })
    .then(function(replyText){
      // keep the dots up for at least 900ms so the agent visibly "thinks"
      var dwell = Math.max(0, (reduced ? 0 : 900) - (Date.now() - t0));
      setTimeout(function(){
        showTyping(false);
        addBubble("assistant", replyText, true);
        pending = false;
        sendBtn.disabled = false;
      }, dwell);
    });
  }

  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", function(e){
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  // Start the greeting only when the chat is actually visible to the visitor
  // (inside an iframe, IntersectionObserver measures against the top page's viewport)
  var greetStarted = false;
  function startGreetingOnce(){
    if (greetStarted) return;
    greetStarted = true;
    runGreeting();
  }
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function(entries){
      if (entries.some(function(e){ return e.isIntersecting; })) {
        io.disconnect();
        startGreetingOnce();
      }
    }, { threshold: 0.35 });
    io.observe(document.body);
  } else {
    startGreetingOnce();
  }
})();
</script>
</body>
</html>
